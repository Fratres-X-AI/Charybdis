[project]
name = "charybdis"
version = "0.1.0"
description = "GPS-denied terrain-aided navigation with hybrid UUV fusion and patrol."
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-timeout>=2.3"]
console = ["streamlit>=1.36", "plotly>=5.22", "pandas>=2.2"]
nn = ["torch>=2.0"]
gebco = ["netCDF4>=1.6", "rasterio>=1.3"]
all = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "streamlit>=1.36",
    "plotly>=5.22",
    "pandas>=2.2",
    "torch>=2.0",
    "netCDF4>=1.6",
    "rasterio>=1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["charybdis", "console"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: long-running sim/MC; skipped on CI unless RUN_SLOW=1",
    "console: UUV tactical console layer (paused; skipped on CI unless RUN_CONSOLE=1)",
]
