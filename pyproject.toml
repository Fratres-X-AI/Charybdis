[project]
name = "charybdis"
version = "0.1.0"
description = "Charybdis - GPS-denied inertial + terrain-contour-matching navigation: an airborne interceptor GDI stack and a UUV tactical Streamlit console."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "streamlit>=1.36",
    "plotly>=5.22",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
py-modules = ["charybdis_core", "charybdis_console", "charybdis_sensors",
              "charybdis_tracking", "charybdis_autonomy", "charybdis_bathy"]
packages = ["charybdis"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
