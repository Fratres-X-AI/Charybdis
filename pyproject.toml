[project]
name = "charybdis"
version = "0.3.0"
description = "Hybrid terrain-aware navigation and patrol guidance for UUVs."
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = [
    "build",
    "hypothesis",
    "mypy",
    "pytest>=9.0.3",
    "pytest-cov",
    "pytest-timeout>=2.3",
    "ruff>=0.15.20",
]
console = ["streamlit>=1.36", "plotly>=5.22", "pandas>=2.2"]
nn = ["torch>=2.0"]
gebco = ["netCDF4>=1.6", "rasterio>=1.3"]
all = [
    "build",
    "hypothesis",
    "mypy",
    "pytest>=9.0.3",
    "pytest-cov",
    "pytest-timeout>=2.3",
    "ruff>=0.15.20",
    "streamlit>=1.36",
    "plotly>=5.22",
    "pandas>=2.2",
    "torch>=2.0",
    "netCDF4>=1.6",
    "rasterio>=1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["charybdis"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "slow: long-running sim/MC; skipped on CI unless RUN_SLOW=1",
    "console: UUV tactical console layer (paused; skipped on CI unless RUN_CONSOLE=1)",
]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
pretty = true
show_error_codes = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "netCDF4",
    "scipy",
    "scipy.*",
]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["charybdis"]
omit = ["charybdis/experimental/*"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["charybdis", "tests", "scripts", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"run_sim.py" = ["E402"]
"scripts/mc_real_region.py" = ["E402"]
"scripts/pod/ten_pass_ladder.py" = ["E402"]
