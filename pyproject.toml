[project]
name = "blacksea-sentry"
version = "0.1.0"
description = "GPS-denied UUV inertial + terrain-contour-matching navigation simulator with a tactical Streamlit console."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "streamlit>=1.36",
    "plotly>=5.22",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
py-modules = ["sentry_core", "blacksea_sentry"]
packages = ["syren"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
