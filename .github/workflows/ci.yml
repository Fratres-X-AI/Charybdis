name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile all sources
        run: python -m compileall -q charybdis charybdis_core.py charybdis_console.py charybdis_sensors.py charybdis_tracking.py charybdis_autonomy.py charybdis_bathy.py charybdis_nn.py charybdis_slam.py charybdis_swarm.py run_sim.py scripts

      - name: Run test suite
        env:
          MPLBACKEND: Agg
        run: python -m pytest -q
