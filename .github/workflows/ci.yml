name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint, format, and typing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install development environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements/ci.txt -e ".[dev]"

      - name: Check lint and formatting
        run: |
          ruff check charybdis tests scripts examples run_sim.py
          ruff format --check charybdis tests scripts examples run_sim.py

      - name: Check stable API typing
        run: |
          mypy charybdis/hybrid \
            charybdis/bathy.py \
            charybdis/simulation/hybrid.py \
            charybdis/evaluation/confidence.py \
            charybdis/evaluation/hybrid.py \
            charybdis/evaluation/scenarios.py \
            charybdis/evaluation/validation.py

  test:
    name: test and coverage (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements/ci.txt -e ".[dev]"

      - name: Compile all sources
        run: python -m compileall -q charybdis console run_sim.py scripts

      - name: Enforce architecture boundaries
        run: python -m pytest tests/test_architecture.py

      - name: Run examples
        if: matrix.python-version == '3.12'
        run: |
          for example in examples/*.py; do
            python "$example" >/dev/null
          done

      - name: Run test suite with coverage
        env:
          MPLBACKEND: Agg
        run: |
          python -m pytest --timeout=120 --timeout-method=thread \
            -m "not console and not slow" --cov=charybdis --cov-report=term-missing \
            --cov-report=xml --cov-fail-under=80
          coverage report --include="charybdis/hybrid/*" --fail-under=90

  package:
    name: build and install wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements/ci.txt build
          python -m build

      - name: Verify wheel contents
        run: |
          python - <<'PY'
          from glob import glob
          from zipfile import ZipFile

          wheel = glob("dist/*.whl")
          assert len(wheel) == 1, wheel
          with ZipFile(wheel[0]) as archive:
              names = set(archive.namelist())
          assert "charybdis/py.typed" in names
          excluded_prefixes = ("console/", "ros2_ws/", "tests/", "examples/", "scripts/")
          assert not any(
              name.startswith(excluded_prefixes) for name in names
          ), sorted(name for name in names if name.startswith(excluded_prefixes))
          PY

      - name: Install and smoke-test wheel
        run: |
          python -m venv /tmp/charybdis-wheel
          /tmp/charybdis-wheel/bin/python -m pip install --upgrade pip
          /tmp/charybdis-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/charybdis-wheel/bin/python - <<'PY'
          import importlib.util
          import charybdis

          assert charybdis.__version__ == "0.3.0"
          assert charybdis.HybridNavigator
          assert importlib.util.find_spec("console") is None
          PY
